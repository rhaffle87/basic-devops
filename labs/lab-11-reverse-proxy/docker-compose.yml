version: '3.8'

services:
  app1:
    image: nginx:alpine
    container_name: backend-alpha
    volumes:
      - ./app1:/usr/share/nginx/html:ro
    networks:
      - internal-net

  app2:
    image: nginx:alpine
    container_name: backend-beta
    volumes:
      - ./app2:/usr/share/nginx/html:ro
    networks:
      - internal-net

  reverse-proxy:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app1
      - app2
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
