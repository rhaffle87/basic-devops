# ==============================================================================
# TEMPLATE KONFIGURASI SERVER BLOCK NGINX DEFAULT (MODUL 7)
# Salin konfigurasi ini ke /etc/nginx/sites-available/default
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Document Root: Arahkan ke direktori file web portofolio
    # Sesuaikan path jika menggunakan direktori home: /home/<username>/Portfolio-responsive
    root /var/www/html/Portfolio-responsive;

    # Urutan pembacaan file index
    index index.html index.htm;

    server_name localhost;

    location / {
        # Mencoba mencari berkas URI yang diminta, jika tidak ada fallback ke 404
        try_files $uri $uri/ =404;
    }
}
