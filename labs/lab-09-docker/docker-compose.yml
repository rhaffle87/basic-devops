version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-production-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
    environment:
      - ENVIRONMENT=production
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge
